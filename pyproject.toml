[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eodhd-market-data-cli"
version = "0.2.0"
description = "Command line client for EODHD: instrument search, end-of-day prices, quotes and return stats."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
eodhd = "eodhd_market_data.cli:main"

[tool.setuptools.packages.find]
include = ["eodhd_market_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
